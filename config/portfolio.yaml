# 포트폴리오 & 전략 설정
# 아래 값들을 본인 상황에 맞게 채워주세요. quantity/avg_price를 모르면 0으로 둬도
# 브리핑 생성 자체는 되지만, 평가액 계산은 빠집니다.

investor_name: "고객"  # 브리핑 인사말에 쓰일 이름 (예: "{investor_name}님 전략 브리핑") — 원하시는 이름으로 바꿔주세요

# 브리핑 상단에 그대로 노출되는 한 줄 전략 태그라인
strategy_tagline: "포지션 트레이더 · 컨센 목표가 ×0.7 보수적 분할매수 · 성장률 20%↓ 또는 목표가 도달 시 분할 익절 · No FOMO / No Fear"

# 매수선 = 컨센서스 목표가 × buy_line_multiplier (범위로 표시하기 위해 low/high 배수를 따로 둘 수도 있음)
buy_line_multiplier: 0.7

# 보유 종목 (국내: yfinance 티커에 .KS 또는 .KQ 접미사 필요, 해외: 그대로)
